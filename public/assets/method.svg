<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">蛋白质主动学习的策略自我改进</title><desc id="desc">外层基于匿名正负经验修订策略，通过开发与独立筛选选择正式策略；内层仅用本次已测标签拟合，执行八批查询；全部策略冻结后做跨任务评价。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#45665b" stroke-width="1.5"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b35}.label{font:11px monospace;letter-spacing:1px;fill:#227662}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#64747a}.box{fill:#fff;stroke:#cedad2;stroke-width:1.2}.arrow{fill:none;stroke:#45665b;stroke-width:1.5;marker-end:url(#a)}</style></defs><rect width="1200" height="660" fill="#fff"/>
<text x="34" y="36" class="label">A / OUTER LOOP</text><text x="34" y="62" class="heading">策略修订、独立筛选与经验维护</text><text x="1165" y="60" text-anchor="end" class="body">每组5条链 · 每链20次机会</text><rect x="24" y="80" width="1152" height="206" rx="6" fill="#f1f6f1"/>
<rect x="43" y="101" width="228" height="100" rx="4" class="box"/><text x="61" y="129" class="heading">匿名经验</text><text x="61" y="153" class="body">尝试、收益、拒绝与筛选反馈</text><text x="61" y="178" class="body">不含序列标签缓存</text>
<rect x="325" y="101" width="228" height="100" rx="4" class="box"/><text x="343" y="129" class="heading">策略改进 Agent</text><text x="343" y="153" class="body">Qwen3.8-27B 提出配置修改</text><text x="343" y="178" class="body">模型 · 采集函数 · 条件规则</text>
<rect x="607" y="101" width="248" height="100" rx="4" class="box"/><text x="625" y="129" class="heading">开发与独立筛选</text><text x="625" y="153" class="body">开发10起点 → 每代新10起点</text><text x="625" y="178" class="body">同预算比较当前策略与候选</text>
<rect x="909" y="101" width="248" height="100" rx="4" class="box"/><text x="927" y="129" class="heading">接受或拒绝</text><text x="927" y="153" class="body">增益、置信区间与终点门槛</text><text x="927" y="178" class="body">仅合格修订更新正式策略</text>
<path d="M271 150H323M553 150H605M855 150H907" class="arrow"/><path d="M1031 202V249H154V203" class="arrow"/><text x="485" y="239" class="body">所有提案与正负反馈保留；失败机会不替补</text><path d="M731 202V313" class="arrow"/><text x="746" y="309" class="body">在内层执行独立回放</text>
<text x="34" y="315" class="label">B / INNER LOOP</text><text x="34" y="341" class="heading">一次160标签预算的在线主动学习</text><rect x="24" y="359" width="1152" height="190" rx="6" fill="#f4f6f7"/>
<rect x="43" y="379" width="228" height="90" rx="4" class="box"/><text x="61" y="408" class="heading">本次已测观测</text><text x="61" y="434" class="body">32随机初始化 + 当前付费前缀</text><text x="61" y="454" class="body">只使用本次标签与诊断</text>
<rect x="325" y="379" width="228" height="90" rx="4" class="box"/><text x="343" y="408" class="heading">模型拟合与诊断</text><text x="343" y="434" class="body">固定数值工具；交叉验证</text><text x="343" y="454" class="body">模型不读取未测标签</text>
<rect x="607" y="379" width="248" height="90" rx="4" class="box"/><text x="625" y="408" class="heading">在线决策 Agent</text><text x="625" y="434" class="body">冻结策略作为指导</text><text x="625" y="454" class="body">合法动作 → 数值候选评分</text>
<rect x="909" y="379" width="248" height="90" rx="4" class="box"/><text x="927" y="408" class="heading">选择16个变体并查询</text><text x="927" y="434" class="body">事前预测保存；原子预算扣费</text><text x="927" y="454" class="body">返回历史实测适应度</text>
<path d="M271 424H323M553 424H605M855 424H907" class="arrow"/><path d="M1031 470V517H154V471" class="arrow"/><text x="457" y="509" class="body">批后反馈更新当前观测 · 共8轮 × 16</text>
<text x="34" y="582" class="label">C / FROZEN EVALUATION</text><rect x="273" y="566" width="627" height="57" rx="4" fill="#172b35"/><text x="296" y="590" style="fill:#fff;font-size:16px;font-weight:600">全部策略冻结 → GB1 + TrpB4 各50新初始化</text><text x="296" y="611" style="fill:#bcd2cc;font-size:12px">初始Agent / 强固定方法 / 随机外层搜索 / 无历史 / ALDE / SSMuLA</text><rect x="925" y="566" width="250" height="57" rx="4" fill="#faf4e8" stroke="#cfb98c" stroke-dasharray="4 3"/><text x="939" y="590" style="font-size:14px;fill:#956526">元层：改进器旧版 / 新版</text><text x="939" y="611" style="font-size:12px;fill:#956526">单独受控比较 · 尚未实施</text><text x="34" y="647" class="body">主要比较：配对ΔnAUBC与95%区间；实用增益与终点条件；TrpB4三比较Holm校正。工程通过不等于科研优势。</text></svg>

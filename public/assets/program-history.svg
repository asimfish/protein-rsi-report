<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="660" viewBox="0 0 1480 660" role="img" aria-labelledby="title desc"><title id="title">Executable policy and history mechanism study</title><desc id="desc">Five history conditions share executable policy tools, archive search and independent screening; freeze all chains and fixed controls before confirmation. Meta improver modification remains a later phase.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667b83"/></marker></defs><rect width="1480" height="660" fill="#ffffff"/><g font-family="Arial,Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#172b35"><text x="42" y="45" font-size="14" fill="#227662" font-weight="600">PROTEIN RSI  /  HISTORY MECHANISM STUDY</text><text x="42" y="85" font-size="29" fill="#172b35" font-weight="600">固定改进程序，先检验条件历史是否有效</text><text x="42" y="115" font-size="17" fill="#60717a" font-weight="400">仅使用已完成回放的实测反馈；处理之间共享程序接口、父代选择、筛选规则与查询预算。</text><rect x="42" y="155" width="325" height="244" rx="10" fill="#e8f2ed" stroke="#9dbdad"/><text x="62" y="191" font-size="22" fill="#172b35" font-weight="600">① 本链完成的匿名历史</text><text x="62" y="224" font-size="16" fill="#60717a" font-weight="400">父代诊断 + 程序改动 + 实测ΔJ</text><text x="62" y="249" font-size="16" fill="#60717a" font-weight="400">无历史 · 极端收益 · 条件检索</text><text x="62" y="274" font-size="16" fill="#60717a" font-weight="400">置换结果 · 随机程序搜索</text><text x="62" y="299" font-size="16" fill="#60717a" font-weight="400">四个历史槽；拒绝与失败均保留</text><text x="62" y="324" font-size="16" fill="#60717a" font-weight="400">历史处理 R 是主要比较变量</text><rect x="408" y="155" width="290" height="244" rx="10" fill="#f5f7f4" stroke="#d5dfda"/><text x="428" y="191" font-size="22" fill="#172b35" font-weight="600">② 提案与档案探索</text><text x="428" y="224" font-size="16" fill="#60717a" font-weight="400">固定 Qwen3.8-27B 生成策略代码</text><text x="428" y="249" font-size="16" fill="#60717a" font-weight="400">有限档案允许探索未接受分支</text><text x="428" y="274" font-size="16" fill="#60717a" font-weight="400">每链20次提案机会</text><text x="428" y="299" font-size="16" fill="#60717a" font-weight="400">5代 × 每代4次</text><text x="428" y="324" font-size="16" fill="#60717a" font-weight="400">所有组从同一 π₀ 出发</text><rect x="740" y="155" width="292" height="244" rx="10" fill="#f5f7f4" stroke="#d5dfda"/><text x="760" y="191" font-size="22" fill="#172b35" font-weight="600">③ 隔离执行与开发</text><text x="760" y="224" font-size="16" fill="#60717a" font-weight="400">def policy(state, tools)</text><text x="760" y="249" font-size="16" fill="#60717a" font-weight="400">每轮最多两种采集评分模型</text><text x="760" y="274" font-size="16" fill="#60717a" font-weight="400">32初始化 + 8轮 × 16查询</text><text x="760" y="299" font-size="16" fill="#60717a" font-weight="400">仅使用本次已测标签</text><text x="760" y="324" font-size="16" fill="#60717a" font-weight="400">每候选10个开发初始化</text><rect x="1074" y="155" width="365" height="244" rx="10" fill="#f5f7f4" stroke="#d5dfda"/><text x="1094" y="191" font-size="22" fill="#172b35" font-weight="600">④ 固定独立筛选</text><text x="1094" y="224" font-size="16" fill="#60717a" font-weight="400">每代10个新筛选初始化</text><text x="1094" y="249" font-size="16" fill="#60717a" font-weight="400">候选 vs 当前部署策略</text><text x="1094" y="274" font-size="16" fill="#60717a" font-weight="400">ΔnAUBC ≥ 0.01；CI下界 &gt; 0</text><text x="1094" y="299" font-size="16" fill="#60717a" font-weight="400">归一化Best@160差值 ≥ −0.02</text><text x="1094" y="324" font-size="16" fill="#60717a" font-weight="400">接受或拒绝：原记录不可修改</text><path d="M367 269L405 269" stroke="#667b83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M698 269L737 269" stroke="#667b83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1032 269L1071 269" stroke="#667b83" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1256 399V430H205V402" stroke="#227662" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="430" y="454" font-size="16" fill="#227662" font-weight="400">匿名实测反馈回到本链历史；筛选规则保持固定</text><rect x="42" y="489" width="920" height="122" rx="10" fill="#f5f7f4" stroke="#d5dfda"/><text x="62" y="525" font-size="22" fill="#172b35" font-weight="600">⑤ 全局冻结 → 独立确认</text><text x="62" y="558" font-size="16" fill="#60717a" font-weight="400">25条链 + 全部43个固定方法；50个新GB1共同初始化，共3400次正式回放</text><text x="62" y="583" font-size="16" fill="#60717a" font-weight="400">五项主要对比 · 配对链×初始化bootstrap · Holm校正；最终反馈不回流</text><rect x="998" y="489" width="441" height="122" rx="10" fill="#f8f3e9" stroke="#e1d3b8"/><text x="1018" y="525" font-size="22" fill="#172b35" font-weight="600">后续阶段（尚未实施）</text><text x="1018" y="558" font-size="16" fill="#60717a" font-weight="400">改进程序自修改与重置起点的能力评价</text><text x="1018" y="583" font-size="16" fill="#60717a" font-weight="400">TrpB4性能测试仍遵守冻结前禁用规则</text></g></svg>